{% extends "base.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i
                            class="fa-solid fa-key text-primary"
                            style="font-size: 55px;"
                        ></i>

                        <h2 class="fw-bold mt-3">
                            Forgot Password?
                        </h2>

                        <p class="text-muted">
                            Enter your email and choose a new password.
                        </p>

                    </div>


                   <form
    method="POST"
    action="{{ url_for('main.forgot_password') }}"
    data-loading-text="Resetting Password..."
>

                        <!-- ============================== -->
                        <!-- Email -->
                        <!-- ============================== -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your registered email"
                                required
                            >

                        </div>


                        <!-- ============================== -->
                        <!-- New Password -->
                        <!-- ============================== -->

                        <div class="mb-3">

    <label
        for="new_password"
        class="form-label"
    >
        New Password
    </label>

    <div class="input-group">

        <input
            type="password"
            id="new_password"
            name="new_password"
            class="form-control"
            placeholder="Enter new password"
            required
        >

        <button
            type="button"
            class="btn btn-outline-secondary"
            onclick="togglePassword('new_password', 'newPasswordIcon')"
            aria-label="Show or hide password"
        >

            <i
                class="fa-solid fa-eye"
                id="newPasswordIcon"
            ></i>

        </button>

    </div>

</div>


                        <!-- ============================== -->
                        <!-- Confirm Password -->
                        <!-- ============================== -->

                        <div class="mb-4">

    <label
        for="confirm_password"
        class="form-label"
    >
        Confirm New Password
    </label>

    <div class="input-group">

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            class="form-control"
            placeholder="Re-enter new password"
            required
        >

        <button
            type="button"
            class="btn btn-outline-secondary"
            onclick="togglePassword('confirm_password', 'confirmPasswordIcon')"
            aria-label="Show or hide password"
        >

            <i
                class="fa-solid fa-eye"
                id="confirmPasswordIcon"
            ></i>

        </button>

    </div>

</div>


                        <!-- ============================== -->
                        <!-- Submit -->
                        <!-- ============================== -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >

                            <i class="fa-solid fa-lock me-2"></i>

                            Reset Password

                        </button>

                    </form>


                    <!-- ============================== -->
                    <!-- Back to Login -->
                    <!-- ============================== -->

                    <div class="text-center mt-4">

                        <a
                            href="{{ url_for('main.login') }}"
                            class="text-decoration-none"
                        >

                            <i class="fa-solid fa-arrow-left me-1"></i>

                            Back to Login

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

function togglePassword(inputId, iconId) {

    const passwordInput =
        document.getElementById(inputId);

    const passwordIcon =
        document.getElementById(iconId);


    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        passwordIcon.classList.remove(
            "fa-eye"
        );

        passwordIcon.classList.add(
            "fa-eye-slash"
        );

    } else {

        passwordInput.type = "password";

        passwordIcon.classList.remove(
            "fa-eye-slash"
        );

        passwordIcon.classList.add(
            "fa-eye"
        );

    }

}

</script>

{% endblock %}
